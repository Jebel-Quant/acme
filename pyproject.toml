[project]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
name = "acme-convex"
version = "0.1.0"
description = "cvxpy-style convex QP modelling: own active-set solver for polyhedral problems, Clarabel for conic ones."
readme = "README.md"
authors = [
    { name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clarabel>=0.11.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "acme"

[project.urls]
Homepage = "https://github.com/Jebel-Quant/acme"
Repository = "https://github.com/Jebel-Quant/acme"

[dependency-groups]
test = [
    "cvxpy>=1.9.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.bumpversion]
current_version = "0.1.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

[tool.rhiza-task]
# pytest-rhiza 0.7.0 doctests the README's pycon fences; rhiza-task 1.8.1 still pins 0.6.0.
# Drop this once the synced rhiza-task pin carries 0.7.0 or later.
pytest-rhiza = "pytest-rhiza @ git+https://github.com/Jebel-Quant/pytest-rhiza@v0.7.0"
